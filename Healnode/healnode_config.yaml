database:
  host: postgres
  port: 5432
  user: c04
  password: secure_password
  database: c04_events
  pool_size: 10

events:
  # Event types to monitor
  types:
    - login
    - database_query
    - file_access
    - service_activity
    - connection
    - health

  # Alert thresholds
  alerts:
    login_failure_threshold: 3
    cpu_threshold: 80
    memory_threshold: 85
    disk_threshold: 90

docker:
  enabled: true
  socket: /var/run/docker.sock
  auto_discover: true
  network: c04_network

total_servers: 58